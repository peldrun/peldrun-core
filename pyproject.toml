[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "peldrun-core"
version = "0.1.0"
description = "High-performance autonomous agent orchestration core"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "PELDRUN Authors and Contributors" }
]
keywords = [
    "ai-agents",
    "autonomous-agents",
    "orchestration",
    "react-loop",
    "sse-streaming",
    "runtime"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
    "aiofiles>=23.0.0"
]

[project.optional-dependencies]
docker = [
    "docker>=7.0.0"
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "anyio>=4.0.0",
    "build>=1.0.0",
    "twine>=5.0.0"
]
all = [
    "peldrun-core[docker,dev]"
]

[project.urls]
Homepage = "https://github.com/peldrun/peldrun-core"
Documentation = "https://github.com/peldrun/peldrun-core#readme"
Repository = "https://github.com/peldrun/peldrun-core.git"
Issues = "https://github.com/peldrun/peldrun-core/issues"

[project.scripts]
peldrun = "peldrun.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["peldrun"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]